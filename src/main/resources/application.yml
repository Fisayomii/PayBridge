spring:
  application:
    name: paybridge
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:postgresql://localhost:5432/paybridge
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  config:
    import: "file:.env[.properties]"

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

paybridge:
  paystack:
    base-url: https://api.paystack.co
    # Put your real Paystack test key in an env variable PAYSTACK_SECRET_KEY,
    # or replace sk_test_placeholder below with your Paystack test secret key.
    secret-key: ${PAYSTACK_SECRET_KEY}

resilience4j:
  retry:
    instances:
      paystackRetry:
        maxAttempts: 3
        waitDuration: 2s
  circuitbreaker:
    instances:
      paystackCircuitBreaker:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3