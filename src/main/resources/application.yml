spring:
  # Several background jobs (rate feed, OFAC list download, payout and funding reconcilers, nightly
  # settlement): with the default single thread, one slow download would stall all the others.
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: paybridge
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paybridge}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase's pooler caps connections per project; old and new instances overlap during a deploy.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    # Logging every statement is costly on a small instance; set PAYBRIDGE_SHOW_SQL=true locally to see them.
    show-sql: ${PAYBRIDGE_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  config:
    import: "optional:file:.env[.properties]"

server:
  # Render (and most PaaS) tell the app which port to listen on through PORT.
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

paybridge:
  payments:
    # paystack  = real Paystack API (test or live key in PAYSTACK_SECRET_KEY)
    # simulated = in-memory provider for offline demos; never use in production
    provider: ${PAYBRIDGE_PAYMENTS_PROVIDER:paystack}
  cors:
    allowed-origins: ${PAYBRIDGE_CORS_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # At least 32 random bytes. Generate one with:  openssl rand -base64 48
      secret: ${PAYBRIDGE_JWT_SECRET:}
      issuer: paybridge
      access-token-ttl: PT2H
      refresh-token-ttl: P14D
    login:
      max-failed-attempts: 5
      lock-duration: PT15M

  # Creates the first admin on startup if none exists. Remove the password once the admin exists.
  bootstrap:
    admin:
      email: ${PAYBRIDGE_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${PAYBRIDGE_BOOTSTRAP_ADMIN_PASSWORD:}

  transfer:
    fees:
      internal: 0.00
      # Bands are checked in order; the last band has no upper bound.
      external-bands:
        - up-to: 5000.00
          fee: 10.00
        - up-to: 50000.00
          fee: 25.00
        - fee: 50.00
    reconciliation:
      enabled: ${PAYBRIDGE_RECONCILIATION_ENABLED:true}
      interval: PT1M
      min-age: PT2M
      batch-size: 100

  funding:
    # Where Paystack sends the customer after checkout (your web/mobile app).
    callback-url: ${PAYBRIDGE_FUNDING_CALLBACK_URL:}
    reconciliation:
      enabled: ${PAYBRIDGE_RECONCILIATION_ENABLED:true}
      interval: PT5M
      min-age: PT5M
      abandon-after: PT24H

  # CBN tiered-KYC limits (NGN). Confirm figures with compliance before go-live.
  compliance:
    tiers:
      1:
        single-transfer-limit: 50000.00
        daily-transfer-limit: 50000.00
        max-balance: 300000.00
      2:
        single-transfer-limit: 100000.00
        daily-transfer-limit: 200000.00
        max-balance: 500000.00
      3:
        single-transfer-limit: 5000000.00
        daily-transfer-limit: 25000000.00
    velocity:
      max-transfers: 10
      window: PT10M
    sanctioned-wallets:
      - WALLET-9999
      - WALLET-BLACKLIST
    blocked-narration-keywords:
      - FRAUD
    remittance:
      # Comprehensive-sanctions jurisdictions: money from these senders is refused outright.
      blocked-countries: [KP, IR, SY, CU]
      # Stand-in for OFAC/UN/UK/EU lists (fictional names). A match parks the remittance for review.
      watchlist:
        - Viktor Sanctionov
        - Blocked Trading Ltd
      review-threshold-usd: 3000.00
    # Real US Treasury OFAC SDN list (public, no key). Hits send a remittance to review.
    ofac:
      enabled: ${PAYBRIDGE_OFAC_ENABLED:true}
      sdn-url: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.CSV
      alt-url: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/ALT.CSV
      refresh: P1D
      cache-dir: ${PAYBRIDGE_SANCTIONS_CACHE_DIR:./data/sanctions}

  # USD -> NGN pricing from the live feed (open.er-api.com, free, no key). Admins can still override.
  fx:
    # Used only before any rate has been stored, with the feed switched off.
    initial-mid-rate: 1550.00
    spread-percent: 1.50
    remittance-fee: 3.00
    quote-ttl: PT10M
    max-rate-move-percent: 10
    feed:
      enabled: ${PAYBRIDGE_FX_FEED_ENABLED:true}
      base-url: https://open.er-api.com
      refresh: PT30M
      # Quoting pauses if no fresh rate has been stored for this long (feed down, or a move refused by the guard).
      max-age: PT6H

  remittance:
    min-amount-usd: 10.00
    max-amount-usd: 10000.00

  settlement:
    liquidity:
      # Warn (status LOW) when Paystack balance minus payouts in flight drops under this.
      low-balance-threshold: 100000.00
      # Balance reported by the simulated provider.
      simulated-balance: 2000000.00
    nightly:
      enabled: ${PAYBRIDGE_SETTLEMENT_NIGHTLY_ENABLED:true}
      cron: "0 30 0 * * *"

  # Self-service BVN verification. simulated (default, offline) or dojah (sandbox: https://sandbox.dojah.io).
  kyc:
    provider: ${PAYBRIDGE_KYC_PROVIDER:simulated}
    # Keys the HMAC of stored BVNs. Defaults to the JWT secret; set its own value in production.
    hash-key: ${PAYBRIDGE_KYC_HASH_KEY:${paybridge.security.jwt.secret}}
    dojah:
      base-url: ${DOJAH_BASE_URL:https://sandbox.dojah.io}
      app-id: ${DOJAH_APP_ID:}
      secret-key: ${DOJAH_SECRET_KEY:}

  paystack:
    base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
    # Never commit keys: set PAYSTACK_SECRET_KEY in the environment or in .env (git-ignored).
    # The same key verifies webhook signatures.
    secret-key: ${PAYSTACK_SECRET_KEY:}
    connect-timeout: PT5S
    read-timeout: PT20S

resilience4j:
  retry:
    instances:
      paystack:
        maxAttempts: 3
        waitDuration: 1s
        # Only retry when the outcome is unknown; a definitive rejection will not change on retry.
        retryExceptions:
          - com.academy.paybridge.shared.provider.GatewayUnavailableException
  circuitbreaker:
    instances:
      paystack:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        # A rejected account number is a healthy provider saying "no", not an outage.
        ignoreExceptions:
          - com.academy.paybridge.shared.provider.GatewayRejectedException
